    <title>Sil & Sil - Clube do Bolo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Poppins"', 'sans-serif'],
            },
            colors: {
              chocolate: {
                400: '#5D4037',
                800: '#3E2723',
                900: '#281815',
                950: '#1a120b',
              },
              caramel: {
                100: '#FFF8E1',
                200: '#FFECB3',
                500: '#FFC107',
              },
              cream: '#FFFCF5',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'fade-in-down': 'fadeInDown 0.5s ease-out forwards',
              'slide': 'slide 40s linear infinite',
              'slide-reverse': 'slideReverse 40s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInDown: {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slide: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              slideReverse: {
                '0%': { transform: 'translateX(-50%)' },
                '100%': { transform: 'translateX(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      /* Custom scrollbar for flavor lists */
      .scrollbar-thin::-webkit-scrollbar { width: 6px; }
      .scrollbar-thin::-webkit-scrollbar-track { background: #f1f1f1; }
      .scrollbar-thin::-webkit-scrollbar-thumb { background: #d4a77e; border-radius: 3px; }
      
      .glass-nav {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      
      .pause-animation:hover {
        animation-play-state: paused;
      }

      /* Chocolate Sprinkles Pattern */
      .bg-sprinkles {
        background-color: #3E2723;
        background-image: 
          radial-gradient(#5D4037 2px, transparent 2px), 
          radial-gradient(#4E342E 2px, transparent 2px);
        background-size: 30px 30px;
        background-position: 0 0, 15px 15px;
      }
    </style>
